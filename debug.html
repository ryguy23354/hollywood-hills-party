<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Engine Debug</title>
  <style>
    body { background:#111; color:#eee; font-family:Arial, sans-serif; padding:20px; }
    h1 { color:#6cf; }
    table { width:100%; border-collapse:collapse; margin-top:20px; }
    td, th { border:1px solid #444; padding:8px; }
    th { background:#222; }
    .ok { color:#7CFC00; }
    .fail { color:#FF6B6B; }
    pre { background:#222; padding:10px; border-radius:6px; }
    #story-start { margin-top:30px; padding:10px 15px; background:#333; display:inline-block; }
  </style>
</head>
<body>
  <h1>Story Debug Panel</h1>
  <p>This tool attempts to load every JSON file used by the story engine and reports exact errors.</p>

  <table>
    <thead>
      <tr><th>File</th><th>Status</th><th>Details</th></tr>
    </thead>
    <tbody id="debug-table"></tbody>
  </table>

  <div id="raw-error"></div>

  <div id="story-start">Start Story Engine</div>

  <script>
    const fileList = [
      "shared_openings.json",
      "shared_endings.json",
      "characters_intro.json",
      "harper_narrative.json",
      "luna_narrative.json",
      "mara_narrative.json",
      "riley_narrative.json",
      "sienna_narrative.json"
    ];

    const table = document.getElementById("debug-table");
    const rawErrorBox = document.getElementById("raw-error");
    const startBtn = document.getElementById("story-start");

    async function testFile(path) {
      const row = document.createElement("tr");

      const nameCell = document.createElement("td");
      const statusCell = document.createElement("td");
      const detailCell = document.createElement("td");

      nameCell.textContent = path;

      try {
        const res = await fetch(path + "?t=" + Date.now()); // bust cache
        if (!res.ok) {
          statusCell.innerHTML = `<span class='fail'>HTTP ${res.status}</span>`;
          detailCell.textContent = "File not found or server rejected it.";
        } else {
          // Try parsing
          try {
            await res.json();
            statusCell.innerHTML = `<span class='ok'>Loaded</span>`;
            detailCell.textContent = "OK";
          } catch (err) {
            statusCell.innerHTML = `<span class='fail'>JSON Parse Error</span>`;
            detailCell.textContent = err.message;
          }
        }
      } catch (err) {
        statusCell.innerHTML = `<span class='fail'>Fetch Error</span>`;
        detailCell.textContent = err.message;
      }

      row.appendChild(nameCell);
      row.appendChild(statusCell);
      row.appendChild(detailCell);
      table.appendChild(row);
    }

    async function runDiagnostics() {
      for (const file of fileList) {
        await testFile(file);
      }
    }

    runDiagnostics();

    startBtn.onclick = () => {
      window.location.href = "index.html";
    };
  </script>
</body>
</html>
