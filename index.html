<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hollywood Party</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #050509;
      --card-bg: #101018;
      --card-border: #252538;
      --accent: #f5a623;
      --accent-soft: rgba(245, 166, 35, 0.18);
      --accent-strong: rgba(245, 166, 35, 0.95);
      --text: #f7f7ff;
      --text-soft: #b7b8d9;
      --danger: #ff4f6a;
      --muted: #6e6f8f;
      --btn-bg: #19192a;
      --btn-bg-hover: #23233a;
      --radius-lg: 18px;
      --radius-pill: 999px;
      --shadow-soft: 0 26px 60px rgba(0, 0, 0, 0.7);
      --shadow-subtle: 0 10px 30px rgba(0, 0, 0, 0.55);
      --transition-fast: 150ms ease-out;
      --transition-med: 220ms ease-out;
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 24px 32px;
      background: radial-gradient(circle at top, #1c1c28 0, #050509 55%);
      min-height: 100vh;
      color: var(--text);
      font-family: var(--font-main);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .app-shell {
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    header.app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title-block h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.03em;
    }

    .title-sub {
      font-size: 13px;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(245, 166, 35, 0.14);
      color: var(--accent-strong);
      font-size: 11px;
      font-weight: 600;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #33ff99;
      box-shadow: 0 0 12px rgba(51, 255, 153, 0.75);
    }

    .header-actions {
      display: inline-flex;
      gap: 10px;
      align-items: center;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .button-pill {
      border-radius: var(--radius-pill);
      padding: 8px 16px;
      font-size: 14px;
      background: var(--btn-bg);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-subtle);
      transition: background var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
    }

    .button-pill.primary {
      background: linear-gradient(135deg, #f5a623, #ff6b3d);
      color: #050509;
      border-color: transparent;
      box-shadow: 0 10px 25px rgba(255, 119, 51, 0.55);
    }

    .button-pill:hover {
      background: var(--btn-bg-hover);
      transform: translateY(-1px);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.7);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .button-pill.primary:hover {
      filter: brightness(1.06);
      transform: translateY(-1px) translateZ(0);
    }

    .button-pill:active {
      transform: translateY(0);
      box-shadow: var(--shadow-subtle);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .scene-card {
      background: radial-gradient(circle at top left, #1e1e33 0, #090914 55%);
      border-radius: 24px;
      padding: 24px 24px 22px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
    }

    .scene-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(245, 166, 35, 0.14) 0, transparent 55%);
      opacity: 0.85;
      pointer-events: none;
    }

    .scene-inner {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(0, 1.2fr);
      gap: 22px;
      align-items: stretch;
    }

    @media (max-width: 900px) {
      .scene-inner {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .scene-main {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .scene-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .scene-title {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.02em;
    }

    .scene-location {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .scene-body-text {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-soft);
      white-space: pre-wrap;
    }

    .choice-list {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .choice-button {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(15, 15, 30, 0.9);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      transition: background var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
    }

    .choice-button span.label {
      flex: 1;
    }

    .choice-button span.chevron {
      font-size: 12px;
      opacity: 0.7;
    }

    .choice-button:hover {
      background: rgba(35, 35, 60, 0.98);
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.75);
      border-color: rgba(245, 166, 35, 0.5);
    }

    .choice-button:active {
      transform: translateY(0);
      box-shadow: var(--shadow-subtle);
    }

    .scene-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .scene-right {
      border-radius: 18px;
      background: rgba(5, 5, 15, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .scene-image-wrap {
      position: relative;
      padding-top: 66%;
      overflow: hidden;
      background: radial-gradient(circle at center, #303050 0, #050509 60%);
    }

    .scene-image-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scene-image-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 8px;
    }

    .scene-image-placeholder span.icon {
      font-size: 20px;
      margin-bottom: 2px;
    }

    .scene-right-footer {
      padding: 9px 12px 11px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .json-status-ok {
      color: #7fffd4;
    }

    .json-status-error {
      color: var(--danger);
    }

    footer.app-footer {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .footer-json {
      opacity: 0.9;
    }

    .footer-json span.file {
      color: var(--text-soft);
    }

    .footer-json span.failed {
      color: var(--danger);
    }

    .footer-hint {
      opacity: 0.7;
    }

    /* Modal */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal-backdrop.visible {
      display: flex;
    }

    .modal {
      width: min(900px, 100% - 32px);
      max-height: calc(100vh - 80px);
      background: radial-gradient(circle at top left, #2a253b 0, #090712 60%);
      border-radius: 24px;
      padding: 18px 20px 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .modal-close {
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(10, 10, 20, 0.9);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-soft);
      font-size: 14px;
      cursor: pointer;
      transition: background var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
    }

    .modal-close:hover {
      background: rgba(35, 35, 60, 0.98);
      transform: translateY(-1px);
      box-shadow: var(--shadow-subtle);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .modal-body {
      overflow: auto;
      padding-right: 2px;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .character-card {
      background: rgba(9, 9, 20, 0.94);
      border-radius: 16px;
      padding: 10px 11px 11px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .character-card h3 {
      margin: 0;
      font-size: 15px;
    }

    .character-tagline {
      font-size: 12px;
      color: var(--muted);
    }

    .character-actions {
      margin-top: 4px;
      display: flex;
      justify-content: flex-end;
    }

    .character-actions button {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(245, 166, 35, 0.12);
      color: var(--accent-strong);
      border: 1px solid rgba(245, 166, 35, 0.65);
      box-shadow: var(--shadow-subtle);
    }

    .character-actions button:hover {
      filter: brightness(1.05);
    }

    .error-banner {
      border-radius: 10px;
      border: 1px solid rgba(255, 79, 106, 0.65);
      background: rgba(80, 12, 24, 0.92);
      color: #ffd5df;
      padding: 6px 10px;
      font-size: 12px;
      margin-top: 6px;
    }

  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="title-block">
        <h1>Hollywood Party</h1>
        <div class="title-sub">
          <span>Dynamic character placement</span>
          <span>&bull;</span>
          <span>Simple story UI</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="meetCharactersBtn" class="button-pill">Meet the Characters</button>
        <button id="restartBtn" class="button-pill primary">Restart Night</button>
      </div>
    </header>

    <main>
      <section class="scene-card">
        <div class="scene-inner">
          <div class="scene-main">
            <div class="scene-title-row">
              <h2 id="sceneTitle" class="scene-title">Hollywood Party</h2>
              <div id="sceneLocation" class="scene-location"></div>
            </div>
            <div id="sceneText" class="scene-body-text">
              Loading story data…
            </div>
            <div id="choiceList" class="choice-list"></div>
            <div id="sceneMeta" class="scene-meta"></div>
            <div id="sceneError" class="error-banner" style="display:none;"></div>
          </div>

          <aside class="scene-right">
            <div class="scene-image-wrap">
              <img id="sceneImage" alt="Scene image" style="display:none;" />
              <div id="sceneImagePlaceholder" class="scene-image-placeholder">
                <span class="icon">🎬</span>
                <div>Scene image will appear here</div>
              </div>
            </div>
            <div class="scene-right-footer">
              <div>JSON status: <span id="jsonStatus" class="json-status-ok">loading…</span></div>
              <div id="sceneTag" class="json-status-ok"></div>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <div class="footer-json" id="footerJson"></div>
      <div class="footer-hint">Tip: use “Restart Night” to return to the main party intro.</div>
    </footer>
  </div>

  <!-- Meet the Characters Modal -->
  <div id="charactersModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="badge"><span class="badge-dot"></span><span>Party Roster</span></div>
          <h2>Meet the Characters</h2>
        </div>
        <button class="modal-close" id="closeCharactersModal" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div id="characterGrid" class="character-grid"></div>
      </div>
    </div>
  </div>

  <script>
    // === CONFIG ===
    const JSON_FILES = [
      "shared_openings.json",
      "main_story.json",
      "shared_endings.json",
      "characters/intro.json",
      "characters/harper/narrative.json",
      "characters/sienna/narrative.json",
      "characters/riley/narrative.json",
      "characters/luna/narrative.json",
      "characters/mara/narrative.json"
    ];

    const FALLBACK_JSON_FILES = [
      // if you are testing locally with a different layout, these will be tried when the primary path fails
      "intro.json",
      "harper_narrative.json",
      "sienna_narrative.json",
      "riley_narrative.json",
      "luna_narrative.json",
      "mara_narrative.json"
    ];

    const START_SCENE_ID = "scene_00_intro";

    // simple mapping from snake_case choice keys to nicer labels
    const CHOICE_LABEL_OVERRIDES = {
      go_to_bar: "Head to the bar",
      go_to_pool: "Check out the pool",
      go_to_lounge: "Slide into the lounge",
      go_to_balcony: "Step out onto the balcony",
      go_to_gameloft: "Climb to the game loft",
      bar_area: "Head to the bar",
      pool_area: "Check out the pool",
      lounge_area: "Slide into the lounge",
      balcony_area: "Step out onto the balcony",
      gameloft_area: "Climb to the game loft",
      approach_harper: "Approach Harper",
      approach_sienna: "Approach Sienna",
      approach_riley: "Approach Riley",
      approach_luna: "Approach Luna",
      approach_mara: "Approach Mara",
      return_to_party: "Return to the main party",
      return: "Slip away to the main party",
      go_home: "Call it a night",
      continue: "Continue…"
    };

    // optional taglines for Meet the Characters
    const CHARACTER_TAGLINES = {
      sienna: "Fiery pop star, emotional and electric.",
      riley: "Athletic firecracker with playful intensity.",
      luna: "Ethereal model with quiet, hypnotic charm.",
      harper: "Movie-star charisma and teasing confidence.",
      mara: "Soft-voiced actress with gentle sensuality."
    };

    // === STATE ===
    const scenes = {};
    const jsonLoadResults = [];
    let currentSceneId = START_SCENE_ID;
    const characterIntros = {}; // slug -> scene object

    // === DOM ===
    const sceneTitleEl = document.getElementById("sceneTitle");
    const sceneLocationEl = document.getElementById("sceneLocation");
    const sceneTextEl = document.getElementById("sceneText");
    const choiceListEl = document.getElementById("choiceList");
    const sceneMetaEl = document.getElementById("sceneMeta");
    const sceneErrorEl = document.getElementById("sceneError");
    const sceneImageEl = document.getElementById("sceneImage");
    const sceneImagePlaceholderEl = document.getElementById("sceneImagePlaceholder");
    const jsonStatusEl = document.getElementById("jsonStatus");
    const sceneTagEl = document.getElementById("sceneTag");
    const footerJsonEl = document.getElementById("footerJson");

    const meetCharactersBtn = document.getElementById("meetCharactersBtn");
    const restartBtn = document.getElementById("restartBtn");

    const charactersModal = document.getElementById("charactersModal");
    const closeCharactersModalBtn = document.getElementById("closeCharactersModal");
    const characterGridEl = document.getElementById("characterGrid");

    // === UTILS ===
    function prettyChoiceLabel(key) {
      if (CHOICE_LABEL_OVERRIDES[key]) return CHOICE_LABEL_OVERRIDES[key];

      // heuristic: split on underscores, capitalise
      return key
        .replace(/_/g, " ")
        .replace(/\\b\\w/g, (m) => m.toUpperCase());
    }

    function imagePathFromScene(scene) {
      if (!scene || !scene.image) return null;
      // assume everything lives in images/ folder
      return "images/" + scene.image;
    }

    function inferLocationFromScene(sceneId) {
      if (!sceneId) return "";
      if (sceneId.includes("bar")) return "Bar";
      if (sceneId.includes("pool")) return "Pool";
      if (sceneId.includes("lounge")) return "Lounge";
      if (sceneId.includes("balcony")) return "Balcony";
      if (sceneId.includes("gameloft")) return "Game Loft";
      return "";
    }

    function getCharacterSlugFromScene(scene) {
      if (!scene) return null;
      if (scene.character) return scene.character;
      const id = scene.id || "";
      const match = id.match(/^scene_(\\w+)_00_intro$/);
      return match ? match[1] : null;
    }

    // === LOADING ===
    async function tryFetchJson(url) {
      try {
        const res = await fetch(url, { cache: "no-cache" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        jsonLoadResults.push({ url, ok: true });
        return data;
      } catch (err) {
        jsonLoadResults.push({ url, ok: false, error: String(err) });
        return null;
      }
    }

    async function loadAllJson() {
      // primary files
      const promises = JSON_FILES.map((url) => tryFetchJson(url));

      // also try fallback ones, but they may legitimately fail
      for (const fb of FALLBACK_JSON_FILES) {
        promises.push(tryFetchJson(fb));
      }

      const results = await Promise.all(promises);

      for (const data of results) {
        if (!data || typeof data !== "object") continue;
        for (const [id, scene] of Object.entries(data)) {
          scenes[id] = scene;
        }
      }

      indexCharacterIntros();
      updateFooterJson();
      updateJsonStatus();
    }

    function indexCharacterIntros() {
      for (const [id, scene] of Object.entries(scenes)) {
        const slug = getCharacterSlugFromScene(scene);
        if (!slug) continue;
        if (!characterIntros[slug]) {
          characterIntros[slug] = scene;
        }
      }
    }

    function updateFooterJson() {
      if (!jsonLoadResults.length) {
        footerJsonEl.textContent = "";
        return;
      }

      const loadedOk = jsonLoadResults.filter((r) => r.ok).map((r) => r.url);
      const failed = jsonLoadResults.filter((r) => !r.ok).map((r) => r.url);

      const parts = [];
      if (loadedOk.length) {
        parts.push(
          "JSON used: " +
            loadedOk
              .map((u) => "<span class=\\"file\\">" + u.replace(/^.*\\//, "") + "</span>")
              .join(" • ")
        );
      }
      if (failed.length) {
        parts.push(
          "Failed: " +
            failed
              .map((u) => "<span class=\\"failed\\">" + u.replace(/^.*\\//, "") + "</span>")
              .join(", ")
        );
      }

      footerJsonEl.innerHTML = parts.join(" • ");
    }

    function updateJsonStatus() {
      const failures = jsonLoadResults.filter((r) => !r.ok);
      if (!jsonLoadResults.length) {
        jsonStatusEl.textContent = "no files loaded";
        jsonStatusEl.className = "json-status-error";
      } else if (failures.length) {
        jsonStatusEl.textContent = failures.length + " file(s) failed";
        jsonStatusEl.className = "json-status-error";
      } else {
        jsonStatusEl.textContent = "all files loaded";
        jsonStatusEl.className = "json-status-ok";
      }
    }

    // === RENDERING ===
    function renderScene(sceneId) {
      const scene = scenes[sceneId];
      currentSceneId = sceneId;
      sceneErrorEl.style.display = "none";
      sceneErrorEl.textContent = "";

      if (!scene) {
        sceneTitleEl.textContent = "Missing scene";
        sceneTextEl.textContent = "No scene found for id: " + sceneId;
        choiceListEl.innerHTML = "";
        sceneLocationEl.textContent = "";
        sceneMetaEl.textContent = "";
        sceneTagEl.textContent = "";
        sceneImageEl.style.display = "none";
        sceneImagePlaceholderEl.style.display = "flex";
        return;
      }

      const charSlug = getCharacterSlugFromScene(scene);
      if (scene.character_name) {
        sceneTitleEl.textContent = scene.character_name;
      } else if (charSlug) {
        // capitalise slug
        sceneTitleEl.textContent = charSlug.charAt(0).toUpperCase() + charSlug.slice(1);
      } else {
        sceneTitleEl.textContent = "Hollywood Party";
      }

      let locationLabel = "";
      if (scene.location && scene.location.trim()) {
        locationLabel = scene.location;
      } else {
        locationLabel = inferLocationFromScene(sceneId);
      }
      sceneLocationEl.textContent = locationLabel ? "Location: " + locationLabel : "";

      sceneTextEl.textContent = scene.text || "";
      sceneMetaEl.textContent = "";

      // scene tag (simple classification)
      if (charSlug) {
        sceneTagEl.textContent = "Focus: " + (scene.character_name || charSlug);
      } else if (locationLabel) {
        sceneTagEl.textContent = "Area: " + locationLabel;
      } else {
        sceneTagEl.textContent = "";
      }

      // image
      const imgPath = imagePathFromScene(scene);
      if (imgPath) {
        sceneImageEl.src = imgPath;
        sceneImageEl.style.display = "block";
        sceneImagePlaceholderEl.style.display = "none";
      } else {
        sceneImageEl.style.display = "none";
        sceneImagePlaceholderEl.style.display = "flex";
      }

      // choices
      choiceListEl.innerHTML = "";
      if (scene.choices && typeof scene.choices === "object") {
        for (const [choiceKey, nextId] of Object.entries(scene.choices)) {
          const btn = document.createElement("button");
          btn.className = "choice-button";
          const labelSpan = document.createElement("span");
          labelSpan.className = "label";
          labelSpan.textContent = prettyChoiceLabel(choiceKey);
          const chevronSpan = document.createElement("span");
          chevronSpan.className = "chevron";
          chevronSpan.textContent = "›";
          btn.appendChild(labelSpan);
          btn.appendChild(chevronSpan);

          btn.addEventListener("click", () => {
            renderScene(nextId);
          });

          choiceListEl.appendChild(btn);
        }
      } else {
        // terminal scene
        const btn = document.createElement("button");
        btn.className = "choice-button";
        const labelSpan = document.createElement("span");
        labelSpan.className = "label";
        labelSpan.textContent = "Return to the main party";
        const chevronSpan = document.createElement("span");
        chevronSpan.className = "chevron";
        chevronSpan.textContent = "↺";
        btn.appendChild(labelSpan);
        btn.appendChild(chevronSpan);
        btn.addEventListener("click", () => renderScene(START_SCENE_ID));
        choiceListEl.appendChild(btn);
      }
    }

    // === MEET THE CHARACTERS MODAL ===
    function buildCharacterGrid() {
      characterGridEl.innerHTML = "";
      const entries = Object.entries(characterIntros);
      if (!entries.length) {
        const div = document.createElement("div");
        div.style.fontSize = "13px";
        div.style.color = "#ccc";
        div.textContent = "No character intro scenes were found in the JSON files.";
        characterGridEl.appendChild(div);
        return;
      }

      for (const [slug, scene] of entries) {
        const card = document.createElement("div");
        card.className = "character-card";

        const title = document.createElement("h3");
        title.textContent = scene.character_name || (slug.charAt(0).toUpperCase() + slug.slice(1));

        const tagline = document.createElement("div");
        tagline.className = "character-tagline";
        tagline.textContent = CHARACTER_TAGLINES[slug] || "";

        const actions = document.createElement("div");
        actions.className = "character-actions";
        const btn = document.createElement("button");
        btn.textContent = "Jump to intro";
        btn.addEventListener("click", () => {
          hideCharactersModal();
          renderScene(scene.id);
        });
        actions.appendChild(btn);

        card.appendChild(title);
        card.appendChild(tagline);
        card.appendChild(actions);

        characterGridEl.appendChild(card);
      }
    }

    function showCharactersModal() {
      buildCharacterGrid();
      charactersModal.classList.add("visible");
      charactersModal.setAttribute("aria-hidden", "false");
    }

    function hideCharactersModal() {
      charactersModal.classList.remove("visible");
      charactersModal.setAttribute("aria-hidden", "true");
    }

    // === INIT ===
    async function init() {
      try {
        await loadAllJson();
        renderScene(START_SCENE_ID);
      } catch (err) {
        sceneErrorEl.style.display = "block";
        sceneErrorEl.textContent = "Error initialising story: " + String(err);
      }
    }

    meetCharactersBtn.addEventListener("click", showCharactersModal);
    closeCharactersModalBtn.addEventListener("click", hideCharactersModal);
    charactersModal.addEventListener("click", (e) => {
      if (e.target === charactersModal) hideCharactersModal();
    });

    restartBtn.addEventListener("click", () => {
      renderScene(START_SCENE_ID);
    });

    // kick everything off
    init();
  </script>
</body>
</html>
