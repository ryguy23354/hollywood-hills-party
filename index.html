
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hollywood Hills Party</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin:0;
  background:#000;
  font-family: Arial, sans-serif;
  color:#fff;
}
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
}
header h1 { margin:0; font-size:28px; }
header button {
  background:#222; color:#fff; padding:10px 16px; border:1px solid #444;
  border-radius:6px; cursor:pointer; margin-left:10px;
}
.main-card {
  max-width:900px; margin:20px auto; background:#111; border-radius:12px;
  padding:30px; box-shadow:0 0 20px rgba(0,0,0,0.5);
}
.scene-title { font-size:26px; margin-bottom:10px; text-align:center; }
.scene-location { text-align:center; font-size:14px; color:#bbb; margin-bottom:20px; }
.scene-text { font-size:18px; margin-bottom:20px; line-height:1.5; text-align:left; }
.scene-image-wrapper { text-align:center; margin-bottom:20px; }
.scene-image-wrapper img {
  max-width:800px; width:100%; height:auto; border-radius:8px; object-fit:contain;
}
.choice-list { text-align:center; }
.choice-list button {
  display:inline-block; margin:8px; padding:12px 20px;
  background:#222; border:1px solid #555; border-radius:6px; color:#fff; cursor:pointer;
}
.modal-backdrop { 
  position:fixed; top:0; left:0; width:100%; height:100%; 
  background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center;
}
.modal-backdrop.visible { display:flex; }
.modal {
  background:#111; padding:20px; border-radius:12px; max-width:600px; width:90%;
}
.character-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.character-card { background:#222; padding:12px; border-radius:8px; text-align:center; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Hollywood Party</h1>
  <div>
    <button id="meetCharactersBtn">Meet the Characters</button>
    <button id="restartBtn">Restart Night</button>
  </div>
</header>

<div class="main-card">
  <div class="scene-title" id="sceneTitle"></div>
  <div class="scene-location" id="sceneLocation"></div>
  <div class="scene-text" id="sceneText"></div>
  <div class="scene-image-wrapper"><img id="sceneImage" /></div>
  <div class="choice-list" id="choiceList"></div>
</div>

<div id="charactersModal" class="modal-backdrop">
  <div class="modal">
    <h2>Characters</h2>
    <div class="character-grid" id="characterGrid"></div>
    <button id="closeCharactersModal">Close</button>
  </div>
</div>

<script>
const START_SCENE_ID = "scene_00_intro";
const STORY_JSON = "main_story.json";
const INTRO_JSON = "characters/intro.json";
const SHARED_OPENINGS_JSON = "characters/shared_openings.json";
const SHARED_ENDINGS_JSON = "characters/shared_endings.json";
const CHARACTER_FILES = {
  sienna: "characters/sienna/narrative.json",
  riley: "characters/riley/narrative.json",
  luna:  "characters/luna/narrative.json",
  harper:"characters/harper/narrative.json",
  mara:  "characters/mara/narrative.json"
};

const CHOICE_LABEL_OVERRIDES = {
  go_to_bar:"Head to the bar",
  go_to_pool:"Head to the pool",
  go_to_lounge:"Head to the lounge",
  go_to_balcony:"Head to the balcony",
  go_to_gameloft:"Head to the game loft",
  return:"Return",
  continue:"Continue"
};

const CHARACTER_TAGLINES = {
  sienna:"Fiery pop star",
  riley:"Playful athlete",
  luna:"Ethereal model",
  harper:"Confident actress",
  mara:"Gentle enchantress"
};

const sceneTitleEl = document.getElementById("sceneTitle");
const sceneLocationEl = document.getElementById("sceneLocation");
const sceneTextEl = document.getElementById("sceneText");
const sceneImageEl = document.getElementById("sceneImage");
const choiceListEl = document.getElementById("choiceList");
const charactersModal = document.getElementById("charactersModal");
const characterGridEl = document.getElementById("characterGrid");

function prettyChoiceLabel(k){ return CHOICE_LABEL_OVERRIDES[k]||k.replace(/_/g," "); }

async function loadJson(p){ try{ let r=await fetch(p); if(!r.ok) return null; return await r.json(); }catch(e){ return null;} }

const scenes = {};
async function init(){
  let files=[STORY_JSON,INTRO_JSON,SHARED_OPENINGS_JSON,SHARED_ENDINGS_JSON,...Object.values(CHARACTER_FILES)];
  let loaded=await Promise.all(files.map(loadJson));
  loaded.forEach((data,i)=>{ if(data && typeof data==="object") Object.assign(scenes,data); });

  renderScene(START_SCENE_ID);
}

function renderScene(id){
  const s = scenes[id];
  if(!s){ sceneTitleEl.textContent="Missing Scene"; sceneTextEl.textContent=id; choiceListEl.innerHTML=""; return;}
  sceneTitleEl.textContent = s.title||"";
  sceneLocationEl.textContent = s.location ? "Location: "+s.location : "";
  sceneTextEl.textContent = s.text||"";
  sceneImageEl.src = s.image ? "images/"+s.image : "";

  choiceListEl.innerHTML="";
  for(let k in s.choices){
    let btn=document.createElement("button");
    btn.textContent=prettyChoiceLabel(k);
    btn.onclick=()=>renderScene(s.choices[k]);
    choiceListEl.appendChild(btn);
  }
}

document.getElementById("meetCharactersBtn").onclick=()=>openModal();
document.getElementById("closeCharactersModal").onclick=()=>closeModal();
document.getElementById("restartBtn").onclick=()=>renderScene(START_SCENE_ID);

function openModal(){
  characterGridEl.innerHTML="";
  Object.keys(CHARACTER_FILES).forEach(n=>{
    let c=document.createElement("div");
    c.className="character-card";
    c.textContent = n.charAt(0).toUpperCase()+n.slice(1)+" — "+(CHARACTER_TAGLINES[n]||"");
    c.onclick=()=>{ closeModal(); };
    characterGridEl.appendChild(c);
  });
  charactersModal.classList.add("visible");
}
function closeModal(){ charactersModal.classList.remove("visible"); }

init();
</script>
</body>
</html>
