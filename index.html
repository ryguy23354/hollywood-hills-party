<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hollywood Party</title>
<script>
async function loadJSON(path) {
  const resp = await fetch(path);
  if (!resp.ok) throw new Error("Failed " + path);
  return resp.json();
}

async function init() {
  try {
    const intro = await loadJSON('characters/intro.json');
    const openings = await loadJSON('characters/shared_openings.json');
    const endings = await loadJSON('characters/shared_endings.json');
    const images = await loadJSON('images_manifest.json');
    document.getElementById("status").textContent = "All JSON loaded successfully.";
  } catch(e) {
    document.getElementById("status").textContent = "JSON load error: " + e;
  }
}
window.onload = init;
</script>
</head>
<body>
<h1>Hollywood Party</h1>
<div id="status">Loading...</div>
</body>
</html>
