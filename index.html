<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hollywood Hills Interactive Story</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      background: #000000;
      overflow-x: hidden;
    }

    /* Background + overlay */
    #background {
      position: fixed;
      inset: 0;
      background: url("images/background_placeholder.jpg") center center / cover no-repeat;
      filter: blur(10px) brightness(0.35);
      z-index: -2;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.12), transparent 55%),
        radial-gradient(circle at bottom, rgba(0,0,0,0.9), #000000);
      z-index: -1;
    }

    /* Loader */
    #loader {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      z-index: 10000;
      animation: loaderPulse 1.5s ease-in-out infinite;
    }

    @keyframes loaderPulse {
      0%   { opacity: 0.3; }
      50%  { opacity: 1; }
      100% { opacity: 0.3; }
    }

    /* Header */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      z-index: 20;
    }

    header .title {
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .header-btn {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.35);
      background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06));
      color: #ffffff;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .header-btn:hover {
      background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.1));
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }

    /* Story container */
    #story-container {
      position: relative;
      max-width: 980px;
      margin: 86px auto 30px;
      padding: 22px 22px 26px;
      border-radius: 18px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 60px rgba(0,0,0,0.8);
      opacity: 0;
      transform: translateY(10px);
      animation: storyFadeIn 0.8s ease forwards;
      animation-delay: 0.5s;
    }

    @keyframes storyFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #scene-title {
      margin: 0 0 4px;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    #scene-subtitle {
      margin: 0 0 14px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.7);
    }

    #scene-image {
      display: none;
      width: 100%;
      border-radius: 14px;
      margin: 10px 0 18px;
      box-shadow: 0 12px 34px rgba(0,0,0,0.75);
    }

    #scene-text {
      margin: 0 0 18px;
      font-size: 1rem;
      line-height: 1.7;
    }

    #choices {
      margin-top: 10px;
    }

    .choice-btn {
      width: 100%;
      padding: 12px 14px;
      margin: 8px 0;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.18), rgba(255,255,255,0.06));
      color: #ffffff;
      font-size: 0.96rem;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .choice-btn:hover {
      background: radial-gradient(circle at top left, rgba(255,255,255,0.26), rgba(255,255,255,0.1));
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    }

    #char-select-panel {
      margin-top: 20px;
      display: none;
    }

    .char-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .char-card {
      border-radius: 16px;
      background: rgba(8,8,8,0.9);
      border: 1px solid rgba(255,255,255,0.18);
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(0,0,0,0.85);
      transform: translateY(8px);
      opacity: 0;
      animation: cardIn 0.5s ease forwards;
    }
    .char-card:nth-child(1) { animation-delay: 0.06s; }
    .char-card:nth-child(2) { animation-delay: 0.14s; }
    .char-card:nth-child(3) { animation-delay: 0.22s; }
    .char-card:nth-child(4) { animation-delay: 0.30s; }
    .char-card:nth-child(5) { animation-delay: 0.38s; }

    @keyframes cardIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .char-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .char-body {
      padding: 10px 12px 14px;
    }

    .char-name {
      margin: 0 0 4px;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .char-prof {
      margin: 0 0 8px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: rgba(255,255,255,0.7);
    }

    .char-desc {
      margin: 0 0 10px;
      font-size: 0.9rem;
      line-height: 1.5;
      color: rgba(255,255,255,0.9);
    }

    .char-cta {
      width: 100%;
      padding: 9px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.24);
      background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.08));
      color: #ffffff;
      font-size: 0.86rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .char-cta:hover {
      background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0.16));
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.7);
    }

    #error-box {
      margin-top: 12px;
      color: #ff6b6b;
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    @media (max-width: 700px) {
      #story-container {
        margin: 80px 10px 24px;
        padding: 18px 14px 18px;
      }
      #scene-title {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <div id="background"></div>
  <div id="overlay"></div>
  <div id="loader">Loading…</div>

  <header>
    <div class="title">Hollywood Hills Story</div>
    <button class="header-btn" onclick="showCharacterProfiles()">Meet the Characters</button>
  </header>

  <div id="story-container">
    <h2 id="scene-title"></h2>
    <div id="scene-subtitle"></div>
    <img id="scene-image" alt="" />
    <p id="scene-text"></p>

    <div id="char-select-panel"></div>
    <div id="choices"></div>
    <div id="error-box"></div>
  </div>

  <script>
    const errorBox = document.getElementById('error-box');
    const sceneTitle = document.getElementById('scene-title');
    const sceneSubtitle = document.getElementById('scene-subtitle');
    const sceneText = document.getElementById('scene-text');
    const sceneImage = document.getElementById('scene-image');
    const choicesBox = document.getElementById('choices');
    const charSelectPanel = document.getElementById('char-select-panel');
    const loader = document.getElementById('loader');

    let storyData = {};
    let characterProfiles = {};
    let CHAR_ASSIGN = {};
    let currentLocationSceneId = null;

    // Option A: locations are the scene IDs themselves
    const LOCATION_SCENES = [
      'scene_bar_01',
      'scene_pool_01',
      'scene_lounge_01',
      'scene_balcony_01',
      'scene_game_loft_01' // game loft (formerly observatory)
    ];

    function isLocationScene(id) {
      return LOCATION_SCENES.includes(id);
    }

    async function loadJSON(path) {
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error(path + ' failed to load (' + res.status + ')');
        return await res.json();
      } catch (err) {
        showError('JSON load error: ' + err.message);
        return null;
      }
    }

    function showError(msg) {
      errorBox.textContent = msg || '';
      console.error(msg);
    }

    function clearError() {
      errorBox.textContent = '';
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    
    function generateCharacterAssignments() {
      const expectedIds = [
        'harper_vale',
        'sienna_brooks',
        'luna_devreaux',
        'mara_quinn',
        'riley_storm'
      ];

      const characters = expectedIds.filter(id => characterProfiles[id]);
      if (characters.length !== expectedIds.length) {
        showError('Character deck mismatch — one or more profiles missing in character_profiles.json.');
        return;
      }

      const locations = LOCATION_SCENES.slice();

      function buildMapping() {
        const locationSlots = {};
        const remaining = {};
        locations.forEach(loc => { locationSlots[loc] = []; });
        characters.forEach(c => { remaining[c] = 2; });

        let attempts = 0;
        while (true) {
          locations.forEach(loc => { locationSlots[loc] = []; });
          characters.forEach(c => { remaining[c] = 2; });

          let valid = true;

          for (const loc of locations) {
            const picks = [];

            for (let i = 0; i < 2; i++) {
              const candidates = characters.filter(c =>
                remaining[c] > 0 && !picks.includes(c)
              );

              if (!candidates.length) {
                valid = false;
                break;
              }

              const pick = candidates[Math.floor(Math.random() * candidates.length)];
              picks.push(pick);
              remaining[pick] -= 1;
            }

            if (!valid) break;
            locationSlots[loc] = picks;
          }

          const allBalanced = Object.values(remaining).every(v => v === 0);

          if (valid && allBalanced) {
            return locationSlots;
          }

          attempts += 1;
          if (attempts > 1000) {
            console.error('Failed to build balanced character-location mapping after many attempts.');
            return null;
          }
        }
      }

      const mapping = buildMapping();
      if (!mapping) {
        showError('Failed to assign characters to locations. Please check character configuration.');
        return;
      }

      CHAR_ASSIGN = mapping;
      console.log('CHAR_ASSIGN', CHAR_ASSIGN);
    }

    function resetAssignmentsAndReturn() {
      CHAR_ASSIGN = {};
      generateCharacterAssignments();
      if (Object.keys(CHAR_ASSIGN).length === LOCATION_SCENES.length) {
        renderScene('scene_00_intro');
      } else {
        showError('Failed to reset character assignments.');
      }
    }

function renderScene(id) {
      clearError();
      charSelectPanel.style.display = 'none';
      charSelectPanel.innerHTML = '';

      const scene = storyData[id];
      if (!scene) {
        showError('Scene not found: ' + id);
        return;
      }

      if (isLocationScene(id)) {
        currentLocationSceneId = id;
        renderLocationScene(id);
        return;
      } else {
        currentLocationSceneId = null;
      }

      sceneTitle.textContent = scene.id || '';
      sceneSubtitle.textContent = '';
      sceneText.textContent = scene.text || '';

      if (scene.image) {
        sceneImage.src = 'images/' + scene.image;
        sceneImage.style.display = 'block';
      } else {
        sceneImage.style.display = 'none';
      }

      choicesBox.innerHTML = '';
      if (scene.choices) {
        
        for (const [label, nextId] of Object.entries(scene.choices)) {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';

          // Special label for generic returns
          if (label === 'return') {
            btn.textContent = 'Look Around Elsewhere';
          } else {
            btn.textContent = label.replace(/_/g, ' ');
          }

          // Support special reset action hook for future use
          if (nextId === 'action_reset_party') {
            btn.onclick = () => resetAssignmentsAndReturn();
          } else {
            btn.onclick = () => renderScene(nextId);
          }

          choicesBox.appendChild(btn);
        }

      }
    }

    function renderLocationScene(sceneId) {
      const scene = storyData[sceneId];
      if (!scene) {
        showError('Location scene missing: ' + sceneId);
        return;
      }

      sceneTitle.textContent = scene.id || '';
      let pretty = sceneId.replace('scene_', '').replace(/_/g, ' ');
      sceneSubtitle.textContent = pretty.toUpperCase();

      sceneText.textContent = scene.text || '';

      if (scene.image) {
        sceneImage.src = 'images/' + scene.image;
        sceneImage.style.display = 'block';
      } else {
        sceneImage.style.display = 'none';
      }

      choicesBox.innerHTML = '';

      const chars = CHAR_ASSIGN[sceneId] || [];
      if (!chars.length) {
        showError('No characters assigned to location scene: ' + sceneId);
        const backBtn = document.createElement('button');
        backBtn.className = 'choice-btn';
        backBtn.textContent = 'Look Around Elsewhere';
        backBtn.onclick = () => renderScene('scene_00_intro');
        choicesBox.appendChild(backBtn);
        return;
      }

      charSelectPanel.style.display = 'block';
      const grid = document.createElement('div');
      grid.className = 'char-grid';

      chars.forEach(charId => {
        const prof = characterProfiles[charId];
        if (!prof) return;

        const card = document.createElement('div');
        card.className = 'char-card';

        if (prof.image) {
          const img = document.createElement('img');
          img.className = 'char-image';
          img.src = 'images/' + prof.image;
          img.alt = prof.name || '';
          card.appendChild(img);
        }

        const body = document.createElement('div');
        body.className = 'char-body';

        const nameEl = document.createElement('h3');
        nameEl.className = 'char-name';
        nameEl.textContent = prof.name || '';
        body.appendChild(nameEl);

        if (prof.profession) {
          const pProf = document.createElement('div');
          pProf.className = 'char-prof';
          pProf.textContent = prof.profession.toUpperCase();
          body.appendChild(pProf);
        }

        if (prof.description) {
          const pDesc = document.createElement('div');
          pDesc.className = 'char-desc';
          pDesc.textContent = prof.description;
          body.appendChild(pDesc);
        }

        const cta = document.createElement('button');
        cta.className = 'char-cta';
        cta.textContent = 'Approach ' + (prof.name || '');
        const introId = prof.intro_scene || '';
        cta.onclick = () => {
          if (introId && storyData[introId]) {
            renderScene(introId);
          } else {
            showError('Intro scene not found for ' + (prof.name || charId) + '. Expected id: ' + introId);
          }
        };
        body.appendChild(cta);

        card.appendChild(body);
        grid.appendChild(card);
      });

      charSelectPanel.innerHTML = '';
      charSelectPanel.appendChild(grid);

      const backBtn = document.createElement('button');
      backBtn.className = 'choice-btn';
      backBtn.textContent = 'Look Around Elsewhere';
      backBtn.onclick = () => renderScene('scene_00_intro');
      choicesBox.appendChild(backBtn);
    }

    function showCharacterProfiles() {
      clearError();
      charSelectPanel.style.display = 'block';
      choicesBox.innerHTML = '';

      sceneTitle.textContent = 'Meet the Characters';
      sceneSubtitle.textContent = 'Overview';
      sceneText.textContent = 'Five women, five stories, one Hollywood Hills night. Learn who they are before you decide who to find.';

      const grid = document.createElement('div');
      grid.className = 'char-grid';

      for (const [id, prof] of Object.entries(characterProfiles)) {
        const card = document.createElement('div');
        card.className = 'char-card';

        if (prof.image) {
          const img = document.createElement('img');
          img.className = 'char-image';
          img.src = 'images/' + prof.image;
          img.alt = prof.name || '';
          card.appendChild(img);
        }

        const body = document.createElement('div');
        body.className = 'char-body';

        const nameEl = document.createElement('h3');
        nameEl.className = 'char-name';
        nameEl.textContent = prof.name || '';
        body.appendChild(nameEl);

        if (prof.profession) {
          const pProf = document.createElement('div');
          pProf.className = 'char-prof';
          pProf.textContent = prof.profession.toUpperCase();
          body.appendChild(pProf);
        }

        if (prof.description) {
          const pDesc = document.createElement('div');
          pDesc.className = 'char-desc';
          pDesc.textContent = prof.description;
          body.appendChild(pDesc);
        }

        const cta = document.createElement('button');
          cta.className = 'char-cta';
          cta.textContent = 'Go to ' + (prof.name || 'Intro');
          const introId = prof.intro_scene || '';
          cta.onclick = () => {
            if (introId && storyData[introId]) {
              renderScene(introId);
            } else {
              showError('Intro scene not found for ' + (prof.name || id) + '. Expected id: ' + introId);
            }
          };
          body.appendChild(cta);

        card.appendChild(body);
        grid.appendChild(card);
      }

      charSelectPanel.innerHTML = '';
      charSelectPanel.appendChild(grid);

      const backBtn = document.createElement('button');
      backBtn.className = 'choice-btn';
      backBtn.textContent = 'Look Around Elsewhere';
      backBtn.onclick = () => renderScene('scene_00_intro');
      choicesBox.appendChild(backBtn);
    }

    async function init() {
      const storyFiles = [
        'main_story.json',
        'shared_openings.json',
        'shared_endings.json',
        'characters_intro.json',
        'harper_narrative.json',
        'luna_narrative.json',
        'sienna_narrative.json',
        'mara_narrative.json',
        'riley_narrative.json'
      ];

      const storyResults = await Promise.all(storyFiles.map(loadJSON));

      if (storyResults.some(r => !r)) {
        showError('One or more story JSON files failed to load — cannot start story.');
      } else {
        const [
          main,
          openings,
          endings,
          intros,
          harper,
          luna,
          sienna,
          mara,
          riley
        ] = storyResults;

        storyData = {
          ...main,
          ...openings,
          ...endings,
          ...intros,
          ...harper,
          ...luna,
          ...sienna,
          ...mara,
          ...riley
        };
      }

      const profiles = await loadJSON('character_profiles.json');
      if (!profiles) {
        showError('Failed to load character_profiles.json — character cards will not work.');
      } else {
        characterProfiles = profiles;
      }

      if (!storyData['scene_00_intro']) {
        showError('Missing starting scene: "scene_00_intro".');
      } else if (Object.keys(characterProfiles).length === 0) {
        showError('No character profiles loaded — check character_profiles.json structure.');
      } else {
        generateCharacterAssignments();
        if (Object.keys(CHAR_ASSIGN).length === LOCATION_SCENES.length) {
          renderScene('scene_00_intro');
        }
      }

      loader.style.opacity = '0';
      setTimeout(() => {
        loader.style.display = 'none';
      }, 400);
    }

    init();
  </script>
</body>
</html>
