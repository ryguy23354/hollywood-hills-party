<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hollywood Hills Party</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="hp-header">
    <div id="hp-title">Hollywood Hills Party</div>
    <div id="hp-navButtons">
      <button id="meetCharactersBtn" class="hp-navButton">Meet the Characters</button>
      <button id="restartBtn" class="hp-navButton">Restart Night</button>
    </div>
  </header>

  <main id="hp-main">
    <section id="hp-sceneCard">
      <h1 id="sceneTitle" class="hp-scene-title"></h1>
      <div id="sceneLocation" class="hp-scene-location"></div>
      <div id="sceneText" class="hp-scene-text"></div>

      <div id="sceneImageWrapper">
        <img id="sceneImage" alt="Scene image">
        <div id="sceneImagePlaceholder">Scene image will appear here</div>
      </div>

      <div id="choicesContainer"></div>
      <div id="status"></div>
    </section>
  </main>

  <div id="charactersModal" aria-hidden="true">
    <div id="charactersModalContent">
      <button class="hp-modal-close" data-modal-close>&times;</button>
      <h2>Tonight's Guests</h2>
      <div id="charactersGrid"></div>
      <button class="hp-modal-close-btn" data-modal-close>Close</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/imageResolver.js"></script>
  <script src="js/storyLoader.js"></script>
  <script src="js/randomizer.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/storyEngine.js"></script>
</body>
</html>
