
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hollywood Hills Party — Interactive Story</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#111;
  color:#eee;
}
header {
  background:#222;
  padding:15px;
  font-size:1.4em;
  border-bottom:1px solid #444;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.top-btn {
  background:#444;
  border:1px solid #666;
  padding:8px 14px;
  border-radius:6px;
  color:#fff;
  cursor:pointer;
}
#story-container {
  padding:20px;
}
.choice-btn {
  display:block;
  background:#333;
  padding:10px;
  margin:8px 0;
  color:#fff;
  border:1px solid #555;
  cursor:pointer;
  border-radius:4px;
}
.choice-btn:hover {
  background:#555;
}
#error-box {
  color:#ff6b6b;
  margin-top:15px;
}
.profile-card {
  background:#222;
  padding:20px;
  border-radius:8px;
  margin-bottom:20px;
}
</style>
</head>

<body>

<header>
  <div>Interactive Story Engine</div>
  <button class="top-btn" onclick="showCharacterProfiles()">Meet the Characters</button>
</header>

<div id="story-container">
  <h2 id="scene-title"></h2>
  <img id="scene-image" style="max-width:100%;display:none;margin-bottom:10px;border-radius:6px;" />
  <p id="scene-text"></p>
  <div id="choices"></div>
  <div id="error-box"></div>
</div>

<script>
let storyData = {};
let profiles = {};

async function loadJSON(path){
  try {
    const r = await fetch(path);
    if(!r.ok) throw new Error(path + " failed to load (" + r.status + ")");
    return await r.json();
  } catch(e){
    document.getElementById("error-box").textContent = e.message;
    return null;
  }
}

function renderScene(id){
  const box = document.getElementById("error-box");
  box.textContent = "";

  if(id === "__show_profiles__"){
    showCharacterProfiles();
    return;
  }

  const scene = storyData[id];
  if(!scene){
    box.textContent = "Scene not found: " + id;
    return;
  }

  document.getElementById("scene-title").textContent = scene.id || "";
  document.getElementById("scene-text").textContent = scene.text || "";

  const img = document.getElementById("scene-image");
  if(scene.image){
    img.src = "images/" + scene.image;
    img.style.display = "block";
  } else {
    img.style.display = "none";
  }

  const cbox = document.getElementById("choices");
  cbox.innerHTML = "";
  if(scene.choices){
    for(const label in scene.choices){
      const next = scene.choices[label];
      const b = document.createElement("button");
      b.className = "choice-btn";
      b.textContent = label.replace(/_/g, " ");
      b.onclick = () => renderScene(next);
      cbox.appendChild(b);
    }
  }
}

function showCharacterProfiles(){
  const container = document.getElementById("story-container");
  container.innerHTML = "<h2>Meet the Characters</h2>";

  if(!profiles.characters){
    container.innerHTML += "<p>Error: character profile data missing.</p>";
    return;
  }

  profiles.characters.forEach(c => {
    container.innerHTML += `
      <div class="profile-card">
        <h3>${c.name}</h3>
        <p><b>Profession:</b> ${c.profession}</p>
        <p>${c.description}</p>
        <button class="choice-btn" onclick="renderScene('${c.start_scene}')">
          Go to ${c.name}'s Intro
        </button>
      </div>
    `;
  });

  container.innerHTML += `
    <button class="choice-btn" onclick="renderScene('scene_00_intro')">
      Return to Party
    </button>
  `;
}

async function init(){
  const files = [
    "shared_openings.json",
    "characters_intro.json",
    "shared_endings.json",
    "harper_narrative.json",
    "luna_narrative.json",
    "mara_narrative.json",
    "riley_narrative.json",
    "sienna_narrative.json",
    "character_profiles.json"
  ];

  for(const f of files){
    const data = await loadJSON(f);
    if(!data) return;
    if(f === "character_profiles.json") profiles = data;
    else Object.assign(storyData, data);
  }

  if(!storyData["scene_00_intro"]){
    document.getElementById("error-box").textContent = "Missing starting scene: scene_00_intro";
    return;
  }

  renderScene("scene_00_intro");
}

init();
</script>

</body>
</html>
