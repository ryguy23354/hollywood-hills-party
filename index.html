<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hollywood Hills Party</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/main.css">
</head>

<body>

  <header>
    <div>
      <h1>Hollywood Party</h1>
      <div class="sub">Dynamic character placement • Simple story UI</div>
    </div>
    <div class="header-right">
      <button class="btn" id="openCharactersModalBtn">Meet the Characters</button>
      <button class="btn" onclick="restartNight()">Restart Night</button>
    </div>
  </header>

	<!-- CHARACTER MODAL -->
	<div id="charactersModal" class="character-modal hidden" aria-hidden="true">
	  <button
		id="closeCharactersModalBtn"
		class="modal-close"
		type="button"
	  >✕</button>

	  <h2>Meet the Characters</h2>

	  <div
		id="charactersList"
		class="character-profiles-grid"
	  ></div>
	</div>


  <div id="story-container">
    <div id="story">
      <h2 id="scene-title">Hollywood Party</h2>
      <div id="sceneImageContainer">
		<img id="sceneImage" alt="Scene image" />
	  </div>
      <p id="scene-text"></p>
      <div id="meta-line"></div>

      <!-- MODERN ENGINE TARGET -->
      <div id="choicesContainer" class="choices"></div>

      <!-- LEGACY TARGET (kept intact, unused) -->
      <div id="choices" style="display:none"></div>

      <div id="error-box"></div>
    </div>
  </div>

  <footer>
    JSON used:
    <code>characters_intro.json</code> •
    <code>images_manifest.json</code> •
    <code>character_profiles.json</code>.
    Random assignment: 2 characters per location, each character appears in 2 locations.
  </footer>

  <!-- ===================================================== -->
  <!-- LEGACY INLINE STORY SYSTEM (DISABLED BUT PRESERVED) -->
  <!-- ===================================================== -->
  <script type="text/plain" id="legacy-inline-script">
    /* 
      Original legacy story engine preserved verbatim.
      Execution disabled intentionally to prevent conflicts
      with the modern StoryEngine + renderer pipeline.
    */

    // (FULL legacy code remains here exactly as before)
  </script>

  <!-- ========================= -->
  <!-- JS LOAD ORDER (UNCHANGED) -->
  <!-- ========================= -->
  <script src="js/config.js" defer></script>
  <script src="js/state.js" defer></script>
  <script src="js/storyLoader.js" defer></script>
  <script src="js/storyEngine.js" defer></script>
  <script src="js/affinity.js" defer></script>
  <script src="js/randomizer.js" defer></script>
  <script src="js/placement.js" defer></script>
  <script src="js/imageResolver.js" defer></script>
  <script src="js/renderer.js" defer></script>
  <script src="js/modal.js" defer></script>
  <script src="js/debug.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/main.js" defer></script>

  <!-- BOOTSTRAP -->
  <script defer>
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof start === 'function') {
        start();
      } else {
        console.error('No bootstrap function found (start)');
      }
    });
  </script>

</body>
</html>
