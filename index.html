<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hollywood Hills Party</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/config.js"></script>
  <script defer src="js/state.js"></script>
  <script defer src="js/storyLoader.js"></script>
  <script defer src="js/randomizer.js"></script>
  <script defer src="js/renderer.js"></script>
  <script defer src="js/modal.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
  <div id="hp-root">
    <header id="hp-header">
      <div id="hp-title-block">
        <h1 id="gameTitle">Hollywood Hills Party</h1>
        <div id="jsonStatus">JSON status: loading…</div>
      </div>
      <div id="hp-header-buttons">
        <button id="meetCharactersBtn" class="hp-pill-btn">Meet the Characters</button>
        <button id="restartBtn" class="hp-pill-btn">Restart Night</button>
      </div>
    </header>

    <main id="hp-main">
      <section id="sceneCard">
        <div id="sceneMeta">
          <h2 id="sceneTitle"></h2>
          <div id="sceneLocation"></div>
        </div>

        <div id="sceneText"></div>

        <div id="sceneImageWrapper">
          <img id="sceneImage" alt="Scene image" />
          <div id="sceneImagePlaceholder">Scene image will appear here.</div>
        </div>

        <div id="choicesContainer"></div>
      </section>
    </main>
  </div>

  <!-- Meet the Characters Modal -->
  <div id="charactersModal" class="hp-modal" aria-hidden="true">
    <div class="hp-modal-backdrop" data-modal-close="true"></div>
    <div class="hp-modal-content">
      <button class="hp-modal-close" data-modal-close="true">✕</button>
      <h2>Meet the Characters</h2>
      <p class="hp-modal-subtitle">Tonight&apos;s lineup and where you can find them.</p>
      <div id="charactersGrid" class="hp-characters-grid"></div>
    </div>
  </div>
</body>
</html>
